name: Manual Maven Central Release

on:
  workflow_dispatch:
    inputs:
      stagingRepositoryId:
        description: 'ID of the staging repository to close and release'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Close and Release Staging Repository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          # ID of the staging repository is passed as an input parameter
          ./gradlew closeAndReleaseSonatypeStagingRepository \
            -Pnexuses.sonatype.stagingRepositoryId=${{ github.event.inputs.stagingRepositoryId }}
